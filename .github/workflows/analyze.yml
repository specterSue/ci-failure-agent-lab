name: CI Failure Analyzer

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  actions: read

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Identify failed workflow
        run: |
          echo "Failed run: ${{ github.event.workflow_run.id }}"
          echo "Preparing to analyze logs..."
