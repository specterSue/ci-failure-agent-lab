name: CI Failure Analyzer

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  actions: read

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Identify failed workflow
        run: |
          echo "Failed run: ${{ github.event.workflow_run.id }}"
          echo "Preparing to analyze logs..."
          
      - name: Retrieve failed logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view "$RUN_ID" --repo "$GH_REPO" --log-failed > failure.log
          cat failure.log
