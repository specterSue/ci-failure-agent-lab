name: CI Failure Analyzer

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  actions: read

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Identify failed workflow
        run: |
          echo "Failed run: ${{ github.event.workflow_run.id }}"
          echo "Preparing to analyze logs..."

      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Retrieve failed logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view "$RUN_ID" --repo "$GH_REPO" --log-failed > failure.log
          cat failure.log


      - name: Analyze failure with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install google-genai
          .venv/bin/python analyzer.py
